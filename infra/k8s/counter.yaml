apiVersion: v1
kind: Service
metadata:
  name: counter
  namespace: ds
spec:
  selector:
    app: counter
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter
  namespace: ds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: counter
  template:
    metadata:
      labels:
        app: counter
    spec:
      containers:
        - name: counter
          image: ds-counter:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: RUST_LOG
              value: info
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
