apiVersion: v1
kind: Service
metadata:
  name: logger
  namespace: ds
spec:
  selector:
    app: logger
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: ds
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: logger
          image: ds-logger:latest
          # Built inside minikube (`eval $(minikube docker-env)`), not pulled.
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: hazelcast-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
