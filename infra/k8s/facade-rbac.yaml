apiVersion: v1
kind: ServiceAccount
metadata:
  name: facade
  namespace: ds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpointslice-reader
  namespace: ds
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: facade-endpointslice-reader
  namespace: ds
subjects:
  - kind: ServiceAccount
    name: facade
    namespace: ds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: endpointslice-reader
