name: ds

services:
  logging-service:
    build:
      context: ..
      dockerfile: services/rust/logger/Dockerfile
    networks:
      - lab
    environment:
      - BIND_ADDR=0.0.0.0:8000
      - RUST_LOG=info
    expose:
      - "8000"
    # Exposed on the host for debugging / direct curl access.
    ports:
      - "8001:8000"

  counter-service:
    build:
      context: ..
      dockerfile: services/rust/counter/Dockerfile
    networks:
      - lab
    environment:
      - BIND_ADDR=0.0.0.0:8000
      - RUST_LOG=info
    expose:
      - "8000"
    ports:
      - "8002:8000"

  facade-service:
    build:
      context: ..
      dockerfile: services/rust/facade/Dockerfile
    networks:
      - lab
    environment:
      - BIND_ADDR=0.0.0.0:8000
      - LOGGING_URL=http://logging-service:8000
      - COUNTER_URL=http://counter-service:8000
      - RUST_LOG=info
    ports:
      - "8080:8000"
    depends_on:
      - logging-service
      - counter-service

  hazelcast-1: &hazelcast
    image: hazelcast/hazelcast:5.4.0
    networks:
      - lab
    environment:
      - HZ_CLUSTERNAME=lab
      - HZ_MAP_DEFAULT_BACKUPCOUNT=2

  hazelcast-2: *hazelcast

  hazelcast-3: *hazelcast

  management-center:
    image: hazelcast/management-center:5.4.1
    networks:
      - lab
    environment:
      - MC_DEFAULT_CLUSTER=lab
      - MC_DEFAULT_CLUSTER_MEMBERS=hazelcast-1,hazelcast-2,hazelcast-3
    ports:
      - "8090:8080"

  postgres:
    image: postgres:17-alpine
    networks:
      - lab
    environment:
      - POSTGRES_USER=bank
      - POSTGRES_PASSWORD=bank
      - POSTGRES_DB=bank
    volumes:
      - pgdata:/var/lib/postgresql/data

networks:
  lab:
    driver: bridge

volumes:
  pgdata:
