name: ds

services:
  config-server:
    build:
      context: ..
      dockerfile: services/rust/config-server/Dockerfile
    networks:
      - lab
    environment:
      - RUST_LOG=info
    ports:
      - "8003:8000"

  counter-service:
    build:
      context: ..
      dockerfile: services/rust/counter/Dockerfile
    networks:
      - lab
    environment:
      - BIND_ADDR=0.0.0.0:8000
      - DATABASE_URL=postgres://bank:bank@postgres/bank
      - CONFIG_SERVER_URL=http://config-server:8000
      - SERVICE_URL=http://counter-service:8000
      - RUST_LOG=info
    depends_on:
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8002:8000"

  facade-service:
    build:
      context: ..
      dockerfile: services/rust/facade/Dockerfile
    networks:
      - lab
    environment:
      - BIND_ADDR=0.0.0.0:8000
      - CONFIG_SERVER_URL=http://config-server:8000
      - SERVICE_URL=http://facade-service:8000
      - RUST_LOG=info
    ports:
      - "8080:8000"
    depends_on:
      - logger-1
      - logger-2
      - logger-3
      - counter-service
      - config-server

  logger-1: &logger
    build: ../services/py/logger
    image: ds-logging
    hostname: logger-1
    networks:
      - lab
    depends_on:
      - config-server
    environment:
      - HZ_MEMBERS=hazelcast-1,hazelcast-2,hazelcast-3
      - CONFIG_SERVER_URL=http://config-server:8000
      - SERVICE_URL=http://logger-1:8000

  logger-2:
    <<: *logger
    hostname: logger-2
    environment:
      - HZ_MEMBERS=hazelcast-2,hazelcast-3,hazelcast-1
      - CONFIG_SERVER_URL=http://config-server:8000
      - SERVICE_URL=http://logger-2:8000

  logger-3:
    <<: *logger
    hostname: logger-3
    environment:
      - HZ_MEMBERS=hazelcast-3,hazelcast-1,hazelcast-2
      - CONFIG_SERVER_URL=http://config-server:8000
      - SERVICE_URL=http://logger-3:8000

  hazelcast-1: &hazelcast
    image: hazelcast/hazelcast:5.4.0
    networks:
      - lab
    environment:
      - HZ_CLUSTERNAME=lab
      - HZ_MAP_DEFAULT_BACKUPCOUNT=2

  hazelcast-2: *hazelcast

  hazelcast-3: *hazelcast

  management-center:
    image: hazelcast/management-center:5.4.1
    networks:
      - lab
    environment:
      - MC_DEFAULT_CLUSTER=lab
      - MC_DEFAULT_CLUSTER_MEMBERS=hazelcast-1,hazelcast-2,hazelcast-3
    ports:
      - "8090:8080"

  postgres:
    image: postgres:17-alpine
    networks:
      - lab
    environment:
      - POSTGRES_USER=bank
      - POSTGRES_PASSWORD=bank
      - POSTGRES_DB=bank
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bank"]
      interval: 2s

  kafka:
    image: apache/kafka:4.3.2
    networks:
      - lab
    environment:
      # Single node in KRaft mode: broker and controller in one process.
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      # Internal topics can't have 3 replicas on a single broker.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s

networks:
  lab:
    driver: bridge

volumes:
  pgdata:
  kafka-data:
